[project]
authors = [
    {name = "Nick DeRobertis", email = "derobertis.nick@gmail.com"},
]
requires-python = "<3.15,>=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "brotli>=1.2.0",
    "httpx>=0.28.1",
    "langchain-classic>=1.0.8",
    "langchain-openai>=1.6.0",
    "livekit-agents>=1.7.0",
    "livekit-plugins-deepgram>=1.7.0",
    "livekit-plugins-elevenlabs>=1.7.0",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "livekit-plugins-openai>=1.7.0",
    "livekit-plugins-silero>=1.7.0",
    "lxml>=6.1.2",
    "openai>=2.54.0",
    "pydantic>=2.13.4",
]
name = "spanish-language-tutor"
version = "0.1.0"
description = "A Spanish language tutor that uses LiveKit to provide real-time feedback on pronunciation and grammar."
readme = "README.md"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
